name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FamilyGraph.slnx

      - name: Build
        run: dotnet build FamilyGraph.slnx --no-restore

      - name: Check formatting
        run: dotnet format FamilyGraph.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
