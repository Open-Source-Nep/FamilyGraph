name: Publish image

# Run by hand from the Actions tab. Builds src/Server/Dockerfile and pushes it to
# ghcr.io/open-source-nep/familygraph, tagged with the commit SHA, the optional version and latest.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to add, for example 1.2.0 (optional)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:latest,$image:sha-${GITHUB_SHA::7}"
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Version must look like 1.2.0, got '$VERSION'"
              exit 1
            fi
            tags="$tags,$image:$VERSION"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
