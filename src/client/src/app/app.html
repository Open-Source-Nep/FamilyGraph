<header>
  <a routerLink="/" class="brand">FamilyGraph</a>
  <div class="end">
    @if (account()) {
      <nav>
        <a routerLink="/people" i18n="@@header.people">People</a>
        <a routerLink="/approvals" i18n="@@header.approvals">Approvals</a>
        @if (isAdministrator()) {
          <a routerLink="/admin/users" i18n="@@header.users">Users</a>
        }
        <a routerLink="/account" i18n="@@header.account">Account</a>
      </nav>
    }
    <app-language-switch />
  </div>
</header>

<main>
  <router-outlet />
</main>
