<dialog #dialog class="dialog" aria-labelledby="delete-person-title" (close)="close()">
  <h2 id="delete-person-title" i18n="@@deletePerson.title">
    Delete
    {{ fullName(person()) }}?
  </h2>
  <p i18n="@@deletePerson.explain">
    This cannot be undone. Their name, photo and gender are erased for good, and they stay in the
    family graph as “Deleted”, with their links.
  </p>
  @if (error(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }
  <div class="actions">
    <button type="button" [disabled]="saving()" (click)="confirm()" i18n="@@common.delete">
      Delete
    </button>
    <button type="button" class="secondary" (click)="close()">
      <ng-container i18n="@@common.cancel">Cancel</ng-container>
    </button>
  </div>
</dialog>
