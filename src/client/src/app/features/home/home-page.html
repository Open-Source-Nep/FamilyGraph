<section class="panel" [class.graph-panel]="!!profiles()?.length">
  @if (error(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }

  @if (profiles(); as profiles) {
    @if (profiles.length === 0) {
      <h1>FamilyGraph</h1>
      <p i18n="@@home.signedInAs">
        Signed in as
        {{ account()?.email }}.
      </p>
      <p>
        <ng-container i18n="@@home.emptyGraph"
          >Your family graph appears here once you add a profile.</ng-container
        >
        <a routerLink="/people/new" i18n="@@home.addPerson">Add a person</a>
      </p>
    } @else {
      <app-home-graph />
    }
  }
</section>
