@if (open()) {
  <fieldset class="birth-date">
    <legend>Birth date <span class="hint">(optional)</span></legend>
    <div class="choices">
      <label>
        <input
          type="radio"
          name="birth-calendar"
          [checked]="calendar() === 'Bs'"
          (change)="setCalendar('Bs')"
        />
        BS
      </label>
      <label>
        <input
          type="radio"
          name="birth-calendar"
          [checked]="calendar() === 'Ad'"
          (change)="setCalendar('Ad')"
        />
        AD
      </label>
    </div>
    <div class="date-parts">
      <label>
        Year
        <input
          type="number"
          inputmode="numeric"
          min="1"
          max="9999"
          [value]="year()"
          (input)="setYear($any($event.target).value)"
        />
      </label>
      <label>
        Month
        <select (change)="setMonth($any($event.target).value)">
          <option value="" [selected]="month() === null">Not known</option>
          @for (name of months(); track $index) {
            <option [value]="$index + 1" [selected]="month() === $index + 1">{{ name }}</option>
          }
        </select>
      </label>
      @if (month() !== null) {
        <label>
          Day
          <select (change)="setDay($any($event.target).value)">
            <option value="" [selected]="day() === null">Not known</option>
            @for (value of days(); track value) {
              <option [value]="value" [selected]="day() === value">{{ value }}</option>
            }
          </select>
        </label>
      }
    </div>
    @if (invalid()) {
      <p class="error" role="alert">That date does not exist.</p>
    }
    <div class="actions">
      @if (canPick()) {
        <button type="button" class="secondary" (click)="picking.set(!picking())">
          {{ picking() ? 'Close the calendar' : 'Pick on the calendar' }}
        </button>
      }
      <button type="button" class="secondary" (click)="remove()">Remove birth date</button>
    </div>
    @if (picking() && canPick()) {
      <osn-nepali-calendar
        script="roman"
        [showScriptToggle]="false"
        [showCalendarToggle]="false"
        [calendar]="calendar() === 'Bs' ? 'bs' : 'ad'"
        [value]="picked()"
        [max]="today"
        (dateSelect)="pick($event)"
      />
    }
  </fieldset>
} @else {
  <p>
    <button type="button" class="secondary" (click)="add()">Add birth date</button>
  </p>
}
