<form [formGroup]="form" (ngSubmit)="submit()" class="name-form">
  <label>
    First name
    <input formControlName="firstName" autocomplete="off" [attr.maxlength]="maxLength" required />
  </label>
  @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
    <p class="error" role="alert">Enter a first name.</p>
  }

  <label>
    Middle name <span class="hint">(optional)</span>
    <input formControlName="middleName" autocomplete="off" [attr.maxlength]="maxLength" />
  </label>

  <label>
    Last name <span class="hint">(optional)</span>
    <input formControlName="lastName" autocomplete="off" [attr.maxlength]="maxLength" />
  </label>

  <label>
    Gender <span class="hint">(optional)</span>
    <select formControlName="gender">
      <option [ngValue]="null">Not set</option>
      @for (gender of genders; track gender) {
        <option [ngValue]="gender">{{ gender }}</option>
      }
    </select>
  </label>

  <label>
    Description <span class="hint">(optional, one line)</span>
    <input
      formControlName="description"
      autocomplete="off"
      placeholder="For example: Teacher, lives in Pokhara"
      [attr.maxlength]="maxDescriptionLength"
    />
  </label>

  <app-birth-date-input [initial]="birthDate()" (changed)="date.set($event)" />
  @if (date()) {
    <label class="check">
      <input type="checkbox" formControlName="birthDateShown" />
      Show the birth date to others
      <span class="hint">(otherwise only you and administrators see it)</span>
    </label>
  }

  <ng-content />

  <div class="actions">
    <button type="submit" [disabled]="busy()">{{ submitLabel() }}</button>
    <button type="button" class="secondary" (click)="cancelled.emit()">Cancel</button>
  </div>
</form>
