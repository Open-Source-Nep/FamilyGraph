@if (error(); as error) {
  <p class="error" role="alert">{{ error }}</p>
}
@if (choices().length > 0) {
  <fieldset class="spouse-links">
    <legend>
      @if (relation() === 'child') {
        <ng-container i18n="@@spouseLinks.alsoChildrenOf"
          >Also add them as children of</ng-container
        >
      } @else {
        <ng-container i18n="@@spouseLinks.alsoParents">Also add as parents</ng-container>
      }
    </legend>
    @for (choice of choices(); track choice.spouse.id) {
      <label>
        <input
          type="checkbox"
          [checked]="choice.checked"
          (change)="tick(choice.spouse.id, $any($event.target).checked)"
        />
        {{ label(choice) }}
      </label>
    }
  </fieldset>
}
